services:
  voyage-blog:
    image: node:20
    container_name: voyage-blog
    working_dir: /app/apps/public-web
    volumes:
      - ./:/app
    ports:
      - "3001:3000"
    environment:
      - HOSTNAME=0.0.0.0
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

  voyage-shop:
    image: node:20
    container_name: voyage-shop
    working_dir: /app/apps/shop-web
    volumes:
      - ./:/app
    ports:
      - "3002:3000"
    environment:
      - HOSTNAME=0.0.0.0
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
